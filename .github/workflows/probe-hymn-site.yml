name: 찬송가 사이트 조사 (임시)

on:
  push:
    paths:
      - ".github/workflows/probe-hymn-site.yml"
      - "tools/probe_hymn_site.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_hymn_site.py
