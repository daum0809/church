name: 임시 시험 결과 지우기

on:
  push:
    paths:
      - ".github/workflows/probe-hymn-site.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete probe-hymn --repo ${{ github.repository }} --yes --cleanup-tag || echo "이미 없음"
