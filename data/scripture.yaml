누가복음10:36~37절: |
  36 네 생각에는 이 세 사람 중에 누가 강도 만난 자의 이웃이 되겠느냐
  37 이르되 자비를 베푼 자니이다 예수께서 이르시되 가서 너도 이와 같이 하라 하시니라
요엘2:21~27절: |
  21 땅이여 두려워 말고 기뻐하며 즐거워할찌어다 여호와께서 큰 일을 행하셨음이로다
  22 들짐승들아 두려워 말찌어다 들의 풀이 싹이 나며 나무가 열매를 맺으며 무화과나무와 포도나무가 다 힘을 내는도다
  23 시온의 자녀들아 너희는 너희 하나님 여호와로 인하여 기뻐하며 즐거워할찌어다 그가 너희를 위하여 비를 내리시되 이른 비를 너희에게 적당하게 주시리니 이른 비와 늦은 비가 전과 같을 것이라
  24 마당에는 밀이 가득하고 독에는 새 포도주와 기름이 넘치리로다
  25 내가 전에 너희에게 보낸 큰 군대 곧 메뚜기와 느치와 황충과 팟중이가 먹은 햇수대로 너희에게 갚아주리니
  26 너희는 먹되 풍족히 먹고 너희에게 놀라운 일을 행하신 너희 하나님 여호와의 이름을 찬송할 것이라
  27 그런즉 내가 이스라엘 가운데 있어 너희 하나님 여호와가 되고 다른 이가 없는 줄을 너희가 알 것이라 내 백성이 영영히 수치를 당치 아니하리로다
