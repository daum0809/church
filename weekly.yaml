교독:                       # 공동기도 화면
  제목: 20. 시편 33편
  # 한 줄 = 한 번 읽는 부분. '인도:' / '회중:' / '다같이:' 를 붙이거나,
  # 아무것도 안 붙이면 인도 → 회중 순서로 번갈아 처리합니다.
  # (인도 = 흰 글씨, 회중 = 노란 글씨, 한 화면에 인도+회중 한 쌍)
  본문: |
    인도: 너희 의인들아 여호와를 즐거워하라 찬송은 정직한 자들이 마땅히 할 바로다
    회중: 수금으로 여호와께 감사하고 열 줄 비파로 찬송할지어다
    인도: 새 노래로 그를 노래하며 즐거운 소리로 아름답게 연주할지어다
    회중: 여호와의 말씀은 정직하며 그가 행하시는 일은 다 진실하시도다
    인도: 그는 공의와 정의를 사랑하심이여 세상에는 여호와의 인자하심이 충만하도다
    회중: 여호와의 말씀으로 하늘이 지음이 되었으며 그 만상을 그의 입 기운으로 이루었도다
    인도: 그가 바닷물을 모아 무더기 같이 쌓으시며 깊은 물을 곳간에 두시도다
    회중: 온 땅은 여호와를 두려워하며 세상의 모든 거민들은 그를 경외할지어다

