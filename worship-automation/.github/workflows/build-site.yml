name: 핸드폰용 웹사이트 게시 (GitHub Pages)

on:
  workflow_dispatch:
  push:
    paths:
      - "web_page.html"
      - "guide.html"
      - "pyworker.js"
      - "worship/**"
      - "templates/**"
      - "fonts/**"
      - "hymns/**"
      - "data/**"
      - "tools/build_site.py"
      - ".github/workflows/build-site.yml"

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 사이트 만들기
        run: |
          pip install segno
          python tools/build_site.py --out site

      - name: 만들어진 파일 확인
        run: |
          for f in index.html guide.html pyworker.js app.zip manifest.json pyodide/pyodide.js pyodide/pyodide.asm.wasm; do
            test -s "site/$f" || { echo "없음: $f"; exit 1; }
          done
          ls site/wheels | grep -q pymupdf || { echo "PDF 엔진 wheel 없음"; exit 1; }
          du -sh site

      - name: gh-pages 브랜치로 올리기
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "핸드폰용 웹사이트 ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Pages 켜기 시도 (권한이 없으면 건너뜀)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "Pages 는 저장소 Settings → Pages 에서 직접 켜 주세요."
